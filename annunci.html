    <!-- NAVBAR END -->
    <h1>Pagina degli annunci</h1>


    <!-- Accordion -->
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-3">
                <h3>Filtra per:</h3>
                <div class="accordion sticky-top" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                Categoria
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse show"
                            data-bs-parent="#accordionExample">
                            <div id="radioWrapper" class="accordion-body">
                                <!-- Radio -->
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="Categories" id="All">
                                    <label class="form-check-label" for="All">
                                        Tutte le categorie
                                    </label>
                                </div>
                               
                                <!-- Radio end -->
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                Prezzo
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <input id="priceInput" class="w-100" type="range" value="" min="" max="">
                                <p id="priceValue" class="lead">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                Parola
                            </button>
                        </h2>
                        <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <input id="wordInput" type="text">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="cardWrapper" class="col-12 col-md-9 d-flex justify-content-around flex-wrap">
                
            </div>
        </div>
    </div>
    <!-- Accordion end -->
    <!-- Fontawesome -->
    <script src="https://kit.fontawesome.com/7c80ed7f5d.js" crossorigin="anonymous"></script>
